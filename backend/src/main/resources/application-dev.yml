# Local development only: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# These secrets are public placeholders. Never use the dev profile in any shared environment.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  otp:
    hmac-secret: ${OTP_HMAC_SECRET:dev-only-insecure-otp-secret-change-me-0123456789}
    delivery:
      # Prints codes to the console instead of sending them. Refused outside the dev profile.
      email-provider: ${OTP_EMAIL_PROVIDER:log}
      sms-provider: ${OTP_SMS_PROVIDER:log}
